[package]
name = "bruce"
version = "0.1.0"
edition = "2018"

[dependencies]
anyhow = "1.0"
sqlx = { workspace = true }
dotenvy = "0.15.6"
tokio = { version = "1.26.0", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
random_word = { path = "../wordle_word/"}
twitch_common = { path = "../twitch_common", features = ["chat", "youtube_chat"] }
sql_common = { path = "../sql_common/"}
clap = { version = "4.1.8", features = ["derive", "env"] }
anathema = "0.2.7"

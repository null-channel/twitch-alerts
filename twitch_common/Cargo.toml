[package]
name = "twitch_common"
version = "0.1.0"
edition = "2018"

[features]
default = []
# Twitch IRC chat plus the platform-neutral chat message, source and hub types.
chat = ["dep:tmi"]
# YouTube live chat read through the YouTube Data API v3. Builds on `chat`.
youtube_chat = ["chat", "dep:reqwest", "dep:serde", "dep:serde_json"]
eventsub = ["dep:futures", "dep:reqwest", "dep:serde", "dep:tokio-tungstenite", "dep:twitch_api", "dep:url"]

[dependencies]
anyhow = "1.0"
tokio = { version = "1.26.0", features = ["sync", "time", "net", "macros", "rt"] }
tracing = "0.1.37"
tmi = { version = "0.8.0", optional = true }
futures = { version = "0.3.31", optional = true }
reqwest = { version = "0.12.4", features = ["json"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio-tungstenite = { version = "0.21.0", features = ["native-tls"], optional = true }
twitch_api = { version = "0.7.0", features = ["reqwest", "helix", "eventsub", "hmac", "unsupported", "mock_api"], optional = true }
url = { version = "2.3.1", optional = true }

[dev-dependencies]
tokio = { version = "1.26.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
